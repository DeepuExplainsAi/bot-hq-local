name: installers
# Builds the installers on each OS and starts the installed app once.
on:
  push:
    branches: [local-installer]
  workflow_dispatch:
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, glob: 'release/*.exe', unpacked: 'release/win-unpacked/Bot HQ.exe' }
          - { name: macOS (Apple silicon), os: macos-latest, glob: 'release/*.dmg', unpacked: 'release/mac-arm64/Bot HQ.app/Contents/MacOS/Bot HQ' }
          - { name: Linux, os: ubuntu-latest, glob: "release/*.AppImage\nrelease/*.deb", unpacked: 'release/linux-unpacked/bot-hq' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/stage-desktop.mjs
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: What was built
        shell: bash
        run: ls -lh release | grep -v unpacked || true
      - name: The installed app starts, serves the UI and talks to nothing outside this machine
        shell: bash
        run: |
          # Pipe through tee so a windowed program is waited for; judge by what it printed, not by its exit code.
          case "$RUNNER_OS" in
            Linux) timeout 180 xvfb-run -a "${{ matrix.unpacked }}" --no-sandbox --smoke 2>&1 | tee smoke.log ;;
            *) "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke.log ;;
          esac
          grep -q "^SMOKE OK" smoke.log
          grep -E "BOT BROWSER OK|APP SERVER OK" smoke.log
      - name: Windows only - the installed app with spaces and non-ASCII letters in its app-data path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          D="$(node -e "const p=require('path').join(require('os').tmpdir(),'D\u012bp\u016b Gupta');require('fs').mkdirSync(p,{recursive:true});console.log(p)")"
          echo "app-data parent: $D"
          BOTHQ_SMOKE_DIR="$D" "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke-unicode.log
          grep -q "^SMOKE OK" smoke-unicode.log
          grep -E "BOT BROWSER OK|APP SERVER OK" smoke-unicode.log
      - name: Windows only - clean first run of the installed app WITH the real Hermes setup, server must stay up
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BOTHQ_SMOKE_HERMES=1 "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke-hermes.log
          grep -q "^SMOKE OK" smoke-hermes.log
      - name: Licenses are inside the package
        shell: bash
        run: |
          for f in LICENSE THIRD_PARTY.md THIRD_PARTY_NOTICES.md; do
            p="$(find release -path '*resources*' -name "$f" -o -path '*Resources*' -name "$f" | head -1)"
            test -s "$p" && echo "ok $p" || { echo "MISSING $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14
