name: installers
# Builds the installers on each OS and starts the installed app once.
on:
  push:
    branches: [local-installer]
  workflow_dispatch:
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, glob: 'release/*.exe', unpacked: 'release/win-unpacked/Bot HQ.exe' }
          - { name: macOS (Apple silicon), os: macos-latest, glob: 'release/*.dmg', unpacked: 'release/mac-arm64/Bot HQ.app/Contents/MacOS/Bot HQ' }
          - { name: Linux, os: ubuntu-latest, glob: "release/*.AppImage\nrelease/*.deb", unpacked: 'release/linux-unpacked/bot-hq' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/stage-desktop.mjs
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: What was built
        shell: bash
        run: ls -lh release | grep -v unpacked || true
      - name: The installed app starts, serves the UI and talks to nothing outside this machine
        shell: bash
        run: |
          # Pipe through tee so a windowed program is waited for; judge by what it printed, not by its exit code.
          case "$RUNNER_OS" in
            Linux) timeout 180 xvfb-run -a "${{ matrix.unpacked }}" --no-sandbox --smoke 2>&1 | tee smoke.log ;;
            *) "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke.log ;;
          esac
          grep -q "^SMOKE OK" smoke.log
          grep -E "BOT BROWSER OK|APP SERVER OK" smoke.log
      - name: Windows only - the installed app with spaces and non-ASCII letters in its app-data path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          D="$(node -e "const p=require('path').join(require('os').tmpdir(),'D\u012bp\u016b Gupta');require('fs').mkdirSync(p,{recursive:true});console.log(p)")"
          echo "app-data parent: $D"
          BOTHQ_SMOKE_DIR="$D" "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke-unicode.log
          grep -q "^SMOKE OK" smoke-unicode.log
          grep -E "BOT BROWSER OK|APP SERVER OK" smoke-unicode.log
      - name: Windows only - clean first run of the installed app WITH the real Hermes setup, server must stay up
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BOTHQ_SMOKE_HERMES=1 "${{ matrix.unpacked }}" --smoke 2>&1 | tee smoke-hermes.log
          grep -q "^SMOKE OK" smoke-hermes.log
      - name: Windows only - run the real .exe installer silently, then start the INSTALLED app normally (not --smoke) like a user
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          INSTALLER="$(ls release/*.exe | head -1)"
          MSYS_NO_PATHCONV=1 "$INSTALLER" /S > install.out 2>&1 &   # not waited for: the installer may start the app itself and not return
          for i in $(seq 1 90); do   # up to 3 min
            APP="$(find "$(cygpath -u "$LOCALAPPDATA")/Programs" "/c/Program Files" -maxdepth 3 -name "Bot HQ.exe" 2>/dev/null | head -1)"
            [ -n "$APP" ] && break; sleep 2
          done
          test -n "$APP" || { echo "installer did not produce Bot HQ.exe"; cat install.out; ls "$(cygpath -u "$LOCALAPPDATA")/Programs" 2>&1; exit 1; }
          echo "installed at: $APP"
          sleep 15
          taskkill //F //IM "Bot HQ.exe" //T >/dev/null 2>&1   # an app the installer started itself: start over from a clean first run
          sleep 3
          rm -rf "$(cygpath -u "$APPDATA")/Bot HQ"
          LOG="$(cygpath -u "$APPDATA")/Bot HQ/logs/server.log"
          "$APP" > app.out 2>&1 &
          APPPID=$!
          ok=0
          for i in $(seq 1 120); do   # up to 10 min: first run installs Hermes (about 2 min)
            sleep 5
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then ok=1; break; fi
            if ! tasklist | grep -qi "Bot HQ.exe"; then echo "the app process is gone"; break; fi
          done
          if [ $ok = 1 ]; then
            sleep 20
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && tasklist | grep -qi "Bot HQ.exe" && echo "INSTALLED APP STAYS UP" || ok=0
          fi
          echo "--- app.out"; cat app.out
          echo "--- server.log (tail)"; tail -40 "$LOG" 2>&1
          taskkill //F //IM "Bot HQ.exe" //T >/dev/null 2>&1
          test $ok = 1
      - name: Licenses are inside the package
        shell: bash
        run: |
          for f in LICENSE THIRD_PARTY.md THIRD_PARTY_NOTICES.md; do
            p="$(find release -path '*resources*' -name "$f" -o -path '*Resources*' -name "$f" | head -1)"
            test -s "$p" && echo "ok $p" || { echo "MISSING $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14
